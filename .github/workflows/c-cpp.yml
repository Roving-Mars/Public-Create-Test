name: C/C++ CI and Release

# 1. 触发条件：Push 到 main 分支，或者打 v 开头的 Tag 时触发
on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

# 2. 必须赋予写入权限，否则 Actions 没有权限往 Release 页面发布文件
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 步骤 1：拉取代码
      - uses: actions/checkout@v4

      # 步骤 2：编译出 .exe 文件
      - name: Compile
        run: |
          mkdir build
          gcc hello.c -o build/my_program.exe

      # 步骤 3：运行程序测试
      - name: Run Program
        run: .\build\my_program.exe

      # 步骤 4：上传到 Artifacts (构建临时产物，方便在 Actions 页面直接下)
      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: my-c-program-windows
          path: build/my_program.exe

      # 步骤 5：【新增】如果是打 Tag 触发的，自动发布到 GitHub Release 页面！
      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/')   # 只有打 Tag 时才执行这一步
        uses: softprops/action-gh-release@v2
        with:
          files: build/my_program.exe             # 自动挂载到 Release 页面的文件
